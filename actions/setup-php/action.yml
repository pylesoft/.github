name: Setup PHP
description: Shared PHP toolchain setup. Call this action with timeout-minutes to bound PHP setup only.

inputs:
  php-version:
    description: PHP version to install.
    default: '8.4'
  extensions:
    description: PHP extensions to install or disable.
    default: ''
  tools:
    description: Additional tools to install, such as Composer or PECL.
    default: ''
  coverage:
    description: Coverage driver passed to setup-php.
    default: ''
  ini-values:
    description: PHP INI overrides.
    default: ''
  ini-file:
    description: Base PHP INI configuration.
    default: production
  github-token:
    description: GitHub token used by setup-php for downloads.
    default: ${{ github.token }}

outputs:
  php-version:
    description: Installed PHP version.
    value: ${{ steps.php.outputs.php-version }}

runs:
  using: composite
  steps:
    - name: Check Ubuntu archive availability
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: sudo python3 "$GITHUB_ACTION_PATH/apt_fallback.py"

    - name: Setup PHP toolchain
      id: php
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        tools: ${{ inputs.tools }}
        coverage: ${{ inputs.coverage }}
        ini-values: ${{ inputs.ini-values }}
        ini-file: ${{ inputs.ini-file }}
        github-token: ${{ inputs.github-token }}
